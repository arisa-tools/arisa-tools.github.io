<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かんたん見積書・請求書メーカー v1.0 | arisa-tools</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

  /* ─── CSS変数 ─── */
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232733;
    --border: #2e3345;
    --accent: #4a9eff;
    --accent-glow: rgba(74,158,255,0.12);
    --green: #34d399;
    --green-glow: rgba(52,211,153,0.12);
    --orange: #fb923c;
    --orange-glow: rgba(251,146,60,0.12);
    --red: #f87171;
    --red-glow: rgba(248,113,113,0.12);
    --text: #e8eaf0;
    --text-dim: #8a8fa8;
    --label: #6b7194;
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }

  .container { max-width: 680px; margin: 0 auto; }

  /* ─── ヘッダー ─── */
  .header { text-align: center; margin-bottom: 24px; padding-top: 12px; }
  .header-icon { font-size: 28px; margin-bottom: 6px; }
  .header h1 { font-size: 20px; font-weight: 900; }
  .header .back-link {
    display: inline-block; margin-top: 8px;
    font-size: 12px; color: var(--text-dim); text-decoration: none;
  }
  .header .back-link:hover { color: var(--accent); }
  .version {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--accent); background: var(--accent-glow);
    padding: 2px 10px; border-radius: 20px; display: inline-block; margin-top: 6px;
  }

  /* ─── タブ ─── */
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-bottom: 20px;
  }
  .tab {
    font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 700;
    background: var(--surface); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 0; cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }

  /* ─── カード ─── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px;
  }
  .card-title {
    font-size: 11px; font-weight: 700; color: var(--label);
    letter-spacing: 0.08em; margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .card-title::before {
    content: ''; width: 3px; height: 14px;
    background: var(--accent); border-radius: 2px; display: inline-block;
  }

  /* ─── フォーム要素 ─── */
  .form-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 10px;
  }
  .form-row.single { grid-template-columns: 1fr; }
  .form-row.triple { grid-template-columns: 2fr 1fr 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label {
    font-size: 11px; color: var(--label); font-weight: 700;
    letter-spacing: 0.04em;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px;
    color: var(--text); font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    transition: border-color 0.15s;
    width: 100%;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .form-group textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
  .form-group select option { background: var(--surface2); }

  /* ─── 宛先の敬称 ─── */
  .honorific-group {
    display: flex; flex-direction: column; gap: 4px;
  }
  .honorific-group label.top-label {
    font-size: 11px; color: var(--label); font-weight: 700; letter-spacing: 0.04em;
  }
  .honorific-btns {
    display: flex; gap: 6px;
  }
  .honorific-btn {
    flex: 1; padding: 8px 0; font-size: 13px; font-weight: 700;
    background: var(--surface2); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .honorific-btn.selected {
    background: var(--green-glow); color: var(--green); border-color: var(--green);
  }

  /* ─── 品目テーブル ─── */
  .items-header {
    display: grid;
    grid-template-columns: 3fr 1fr 1.2fr 1.2fr 36px;
    gap: 6px; margin-bottom: 6px;
    padding: 0 2px;
  }
  .items-header span {
    font-size: 11px; color: var(--label); font-weight: 700;
    letter-spacing: 0.04em; text-align: center;
  }
  .items-header span:first-child { text-align: left; }

  .item-row {
    display: grid;
    grid-template-columns: 3fr 1fr 1.2fr 1.2fr 36px;
    gap: 6px; margin-bottom: 6px; align-items: center;
  }
  .item-row input {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 8px;
    color: var(--text); font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    width: 100%; transition: border-color 0.15s;
  }
  .item-row input:focus { outline: none; border-color: var(--accent); }
  .item-row input[type="number"] { text-align: right; }
  .item-amount {
    text-align: right; font-size: 13px; color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    padding: 7px 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px;
  }
  .del-btn {
    width: 32px; height: 32px; border-radius: 6px;
    background: var(--red-glow); color: var(--red);
    border: 1px solid rgba(248,113,113,0.3);
    cursor: pointer; font-size: 16px; display: flex;
    align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  .del-btn:hover { background: rgba(248,113,113,0.25); }

  /* ─── 行追加ボタン ─── */
  .add-row-btn {
    width: 100%; padding: 9px;
    background: transparent; border: 1px dashed var(--border);
    border-radius: 6px; color: var(--text-dim); font-size: 13px;
    cursor: pointer; transition: all 0.15s; margin-top: 4px;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .add-row-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── 合計欄 ─── */
  .totals {
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 8px; margin-top: 4px;
  }
  .total-row {
    display: flex; align-items: center; gap: 16px;
    font-size: 14px;
  }
  .total-label { color: var(--text-dim); min-width: 80px; text-align: right; }
  .total-value {
    font-family: 'JetBrains Mono', monospace; font-size: 15px;
    min-width: 120px; text-align: right;
  }
  .total-value.grand {
    color: var(--accent); font-size: 18px; font-weight: 700;
  }
  .divider {
    width: 260px; height: 1px; background: var(--border); margin: 2px 0;
  }

  /* 消費税ラジオボタン */
  .tax-group {
    display: flex; align-items: center; gap: 16px;
  }
  .tax-group span { font-size: 13px; color: var(--text-dim); }
  .tax-option {
    display: flex; align-items: center; gap: 5px;
    cursor: pointer; font-size: 13px; color: var(--text-dim);
  }
  .tax-option input[type="radio"] { accent-color: var(--accent); }
  .tax-option.selected { color: var(--accent); }

  /* ─── 発行者設定メモ ─── */
  .save-note {
    font-size: 11px; color: var(--label); margin-top: 8px;
    display: flex; align-items: center; gap: 4px;
  }

  /* ─── ボタン ─── */
  .btn-area {
    display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap;
  }
  .btn-print {
    flex: 1; padding: 14px 20px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: opacity 0.15s;
  }
  .btn-print:hover { opacity: 0.85; }
  .btn-reset {
    padding: 14px 20px;
    background: var(--surface2); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.15s;
  }
  .btn-reset:hover { color: var(--red); border-color: var(--red); }

  /* ─── フッター ─── */
  .footer {
    text-align: center; padding: 20px 0 8px;
    font-size: 11px; color: var(--label);
  }

  /* ═══════════════════════════════════════
     印刷用CSS
  ═══════════════════════════════════════ */
  @media print {
    @page {
      size: A4 portrait;
      margin: 15mm 15mm 15mm 15mm;
    }

    /* 画面UI非表示 */
    body {
      background: #fff !important;
      color: #000 !important;
      padding: 0 !important;
      font-family: 'Noto Sans JP', 'ヒラギノ角ゴ Pro', 'Meiryo', sans-serif !important;
    }
    .header,
    .tabs,
    .no-print,
    .del-btn,
    .add-row-btn,
    .btn-area,
    .footer,
    .save-note,
    .card-title {
      display: none !important;
    }
    .container { max-width: 100% !important; }
    .card {
      background: #fff !important;
      border: none !important;
      padding: 0 !important;
      margin-bottom: 0 !important;
      border-radius: 0 !important;
    }

    /* 印刷レイアウト */
    #print-area {
      display: block !important;
    }
  }

  /* 印刷エリア（画面では非表示） */
  #print-area { display: none; }

  /* ─── レスポンシブ ─── */
  @media (max-width: 520px) {
    .form-row { grid-template-columns: 1fr; }
    .form-row.triple { grid-template-columns: 1fr; }
    .items-header { display: none; }
    .item-row {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
    }
    .item-row .item-name { grid-column: 1 / -1; }
    .item-row .del-btn { grid-row: 1; grid-column: 2; justify-self: end; }
    .total-value { min-width: 90px; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-icon">📄</div>
    <h1>かんたん見積書・請求書メーカー</h1>
    <a class="back-link" href="index.html">← ツール一覧に戻る</a>
    <br>
    <span class="version">No.013 v1.0</span>
  </div>

  <!-- タブ -->
  <div class="tabs no-print">
    <button class="tab active" onclick="switchTab('estimate')">見積書</button>
    <button class="tab" onclick="switchTab('invoice')">請求書</button>
  </div>

  <!-- ═══ 印刷エリア（window.print()時に描画） ═══ -->
  <div id="print-area"></div>

  <!-- ═══ 入力フォーム ═══ -->
  <div id="form-area">

    <!-- 発行情報 -->
    <div class="card">
      <div class="card-title">発行情報</div>
      <div class="form-row">
        <div class="form-group">
          <label>発行日</label>
          <input type="date" id="issue-date">
        </div>
        <div class="form-group">
          <label>文書番号</label>
          <input type="text" id="doc-number" placeholder="例：2026-001">
        </div>
      </div>
    </div>

    <!-- 宛先情報 -->
    <div class="card">
      <div class="card-title">宛先</div>
      <div class="form-row">
        <div class="form-group">
          <label>会社名 / 名前</label>
          <input type="text" id="client-name" placeholder="例：株式会社〇〇">
        </div>
        <div class="form-group">
          <label>担当者名</label>
          <input type="text" id="client-person" placeholder="例：田中 太郎">
        </div>
      </div>
      <div class="honorific-group">
        <label class="top-label">敬称</label>
        <div class="honorific-btns">
          <button class="honorific-btn selected" onclick="selectHonorific(this, '御中')">御中</button>
          <button class="honorific-btn" onclick="selectHonorific(this, '様')">様</button>
        </div>
      </div>
    </div>

    <!-- 発行者情報 -->
    <div class="card">
      <div class="card-title">発行者情報 <span style="font-size:10px;color:var(--green);font-weight:400;">（ブラウザに自動保存）</span></div>
      <div class="form-row">
        <div class="form-group">
          <label>名前</label>
          <input type="text" id="issuer-name" placeholder="例：山田 花子">
        </div>
        <div class="form-group">
          <label>屋号</label>
          <input type="text" id="issuer-company" placeholder="例：ハナコ事務所">
        </div>
      </div>
      <div class="form-row single">
        <div class="form-group">
          <label>住所</label>
          <input type="text" id="issuer-address" placeholder="例：〒000-0000 〇〇県〇〇市...">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>電話番号</label>
          <input type="tel" id="issuer-tel" placeholder="例：090-0000-0000">
        </div>
        <div class="form-group">
          <label>メールアドレス</label>
          <input type="email" id="issuer-email" placeholder="例：hanako@example.com">
        </div>
      </div>
      <div class="save-note">※ 発行者情報はこのブラウザに保存されます（他の端末には共有されません）</div>
    </div>

    <!-- 品目テーブル -->
    <div class="card">
      <div class="card-title">品目</div>
      <div class="items-header">
        <span>品名</span>
        <span>数量</span>
        <span>単価</span>
        <span>金額</span>
        <span></span>
      </div>
      <div id="items-container"></div>
      <button class="add-row-btn no-print" onclick="addItemRow()">＋ 行を追加</button>
    </div>

    <!-- 合計 -->
    <div class="card">
      <div class="card-title">合計</div>
      <div class="form-row single" style="margin-bottom:14px;">
        <div class="form-group">
          <label>消費税</label>
          <div class="tax-group">
            <label class="tax-option">
              <input type="radio" name="tax" value="10" checked onchange="calcTotal()"> 10%
            </label>
            <label class="tax-option">
              <input type="radio" name="tax" value="8" onchange="calcTotal()"> 8%（軽減）
            </label>
            <label class="tax-option">
              <input type="radio" name="tax" value="0" onchange="calcTotal()"> 非課税
            </label>
          </div>
        </div>
      </div>
      <div class="totals">
        <div class="total-row">
          <span class="total-label">小計</span>
          <span class="total-value" id="subtotal-display">¥0</span>
        </div>
        <div class="total-row">
          <span class="total-label" id="tax-label-display">消費税（10%）</span>
          <span class="total-value" id="tax-display">¥0</span>
        </div>
        <div class="divider"></div>
        <div class="total-row">
          <span class="total-label" style="font-weight:700;color:var(--text);">合計（税込）</span>
          <span class="total-value grand" id="total-display">¥0</span>
        </div>
      </div>
    </div>

    <!-- 備考 -->
    <div class="card">
      <div class="card-title">備考</div>
      <div class="form-group">
        <textarea id="memo" placeholder="例：お振込期限：2026年〇月〇日&#10;振込先：〇〇銀行 〇〇支店 普通 0000000&#10;口座名義：ハナコ事務所"></textarea>
      </div>
    </div>

    <!-- ボタン -->
    <div class="btn-area no-print">
      <button class="btn-print" onclick="printDoc()">PDFで保存 / 印刷する</button>
      <button class="btn-reset" onclick="resetForm()">フォームをリセット</button>
    </div>

  </div><!-- /form-area -->

  <div class="footer">arisa-tools | No.013 かんたん見積書・請求書メーカー</div>

</div><!-- /container -->

<script>
  /* ─── 状態管理 ─── */
  let docType = 'estimate'; // 'estimate' | 'invoice'
  let honorific = '御中';
  let itemCount = 0;

  /* ─── 初期化 ─── */
  window.addEventListener('DOMContentLoaded', () => {
    // 今日の日付をデフォルト設定
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('issue-date').value = `${yyyy}-${mm}-${dd}`;

    // 発行者情報をLocalStorageから復元
    loadIssuerInfo();

    // 発行者フィールドの変更を監視して自動保存
    ['issuer-name','issuer-company','issuer-address','issuer-tel','issuer-email'].forEach(id => {
      document.getElementById(id).addEventListener('input', saveIssuerInfo);
    });

    // 最初から3行表示
    addItemRow();
    addItemRow();
    addItemRow();
  });

  /* ─── タブ切替 ─── */
  function switchTab(type) {
    docType = type;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
  }

  /* ─── 敬称 ─── */
  function selectHonorific(btn, value) {
    honorific = value;
    document.querySelectorAll('.honorific-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  /* ─── 品目行の追加 ─── */
  function addItemRow() {
    itemCount++;
    const container = document.getElementById('items-container');
    const row = document.createElement('div');
    row.className = 'item-row';
    row.id = `item-row-${itemCount}`;
    const id = itemCount;

    row.innerHTML = `
      <input type="text" class="item-name" placeholder="品名" oninput="calcTotal()">
      <input type="number" class="item-qty" placeholder="1" value="" min="0" oninput="calcRowAmount(${id}); calcTotal();">
      <input type="number" class="item-price" placeholder="0" value="" min="0" oninput="calcRowAmount(${id}); calcTotal();">
      <div class="item-amount" id="amount-${id}">¥0</div>
      <button class="del-btn no-print" onclick="delItemRow(${id})" title="この行を削除">×</button>
    `;
    container.appendChild(row);
    calcTotal();
  }

  /* ─── 行削除 ─── */
  function delItemRow(id) {
    const row = document.getElementById(`item-row-${id}`);
    if (row) {
      row.remove();
      calcTotal();
    }
  }

  /* ─── 行ごとの金額計算 ─── */
  function calcRowAmount(id) {
    const row = document.getElementById(`item-row-${id}`);
    if (!row) return 0;
    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
    const price = parseFloat(row.querySelector('.item-price').value) || 0;
    const amount = qty * price;
    const el = document.getElementById(`amount-${id}`);
    if (el) el.textContent = '¥' + amount.toLocaleString('ja-JP');
    return amount;
  }

  /* ─── 合計計算 ─── */
  function calcTotal() {
    // 全行の金額を集計
    let subtotal = 0;
    document.querySelectorAll('.item-row').forEach(row => {
      const id = row.id.replace('item-row-', '');
      subtotal += calcRowAmount(id);
    });

    // 税率
    const taxRate = parseInt(document.querySelector('input[name="tax"]:checked').value);
    const taxAmt = Math.floor(subtotal * taxRate / 100);
    const total = subtotal + taxAmt;

    // 表示更新
    document.getElementById('subtotal-display').textContent = '¥' + subtotal.toLocaleString('ja-JP');
    document.getElementById('tax-display').textContent = '¥' + taxAmt.toLocaleString('ja-JP');
    document.getElementById('total-display').textContent = '¥' + total.toLocaleString('ja-JP');

    // 税ラベル更新
    const taxLabel = taxRate === 0 ? '消費税（非課税）' : `消費税（${taxRate}%）`;
    document.getElementById('tax-label-display').textContent = taxLabel;
  }

  /* ─── LocalStorage 保存・読込 ─── */
  function saveIssuerInfo() {
    const data = {
      name: document.getElementById('issuer-name').value,
      company: document.getElementById('issuer-company').value,
      address: document.getElementById('issuer-address').value,
      tel: document.getElementById('issuer-tel').value,
      email: document.getElementById('issuer-email').value,
    };
    localStorage.setItem('arisa-tools-issuer', JSON.stringify(data));
  }

  function loadIssuerInfo() {
    try {
      const raw = localStorage.getItem('arisa-tools-issuer');
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.name)    document.getElementById('issuer-name').value = data.name;
      if (data.company) document.getElementById('issuer-company').value = data.company;
      if (data.address) document.getElementById('issuer-address').value = data.address;
      if (data.tel)     document.getElementById('issuer-tel').value = data.tel;
      if (data.email)   document.getElementById('issuer-email').value = data.email;
    } catch(e) {}
  }

  /* ─── フォームリセット ─── */
  function resetForm() {
    if (!confirm('フォームの内容をすべてリセットしますか？\n（発行者情報は保持されます）')) return;

    document.getElementById('doc-number').value = '';
    document.getElementById('client-name').value = '';
    document.getElementById('client-person').value = '';
    document.getElementById('memo').value = '';

    // 品目行を全削除して3行再生成
    document.getElementById('items-container').innerHTML = '';
    itemCount = 0;
    addItemRow();
    addItemRow();
    addItemRow();

    // 税率を10%に戻す
    document.querySelector('input[name="tax"][value="10"]').checked = true;
    calcTotal();
  }

  /* ─── 印刷 ─── */
  function printDoc() {
    // データ収集
    const title = docType === 'estimate' ? '見　積　書' : '請　求　書';
    const issueDate = formatDate(document.getElementById('issue-date').value);
    const docNumber = document.getElementById('doc-number').value || '―';
    const clientName = document.getElementById('client-name').value || '　';
    const clientPerson = document.getElementById('client-person').value;
    const issuerName = document.getElementById('issuer-name').value || '　';
    const issuerCompany = document.getElementById('issuer-company').value;
    const issuerAddress = document.getElementById('issuer-address').value || '　';
    const issuerTel = document.getElementById('issuer-tel').value;
    const issuerEmail = document.getElementById('issuer-email').value;
    const memo = document.getElementById('memo').value.replace(/\n/g, '<br>');

    // 品目行収集
    const rows = document.querySelectorAll('.item-row');
    let itemsHtml = '';
    let subtotal = 0;

    rows.forEach(row => {
      const name = row.querySelector('.item-name').value;
      const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
      const price = parseFloat(row.querySelector('.item-price').value) || 0;
      const amount = qty * price;
      subtotal += amount;
      itemsHtml += `
        <tr>
          <td>${escHtml(name)}</td>
          <td style="text-align:center;">${qty === 0 && !name ? '' : qty}</td>
          <td style="text-align:right;">${price === 0 && !name ? '' : '¥' + price.toLocaleString('ja-JP')}</td>
          <td style="text-align:right;">${amount === 0 && !name ? '' : '¥' + amount.toLocaleString('ja-JP')}</td>
        </tr>`;
    });

    const taxRate = parseInt(document.querySelector('input[name="tax"]:checked').value);
    const taxAmt = Math.floor(subtotal * taxRate / 100);
    const total = subtotal + taxAmt;
    const taxLabel = taxRate === 0 ? '消費税（非課税）' : `消費税（${taxRate}%）`;

    // 発行者ブロック
    let issuerHtml = '';
    if (issuerCompany) issuerHtml += `<div style="font-size:16px;font-weight:bold;">${escHtml(issuerCompany)}</div>`;
    issuerHtml += `<div>${escHtml(issuerName)}</div>`;
    if (issuerAddress) issuerHtml += `<div style="font-size:12px;color:#555;">${escHtml(issuerAddress)}</div>`;
    if (issuerTel)     issuerHtml += `<div style="font-size:12px;color:#555;">TEL：${escHtml(issuerTel)}</div>`;
    if (issuerEmail)   issuerHtml += `<div style="font-size:12px;color:#555;">Mail：${escHtml(issuerEmail)}</div>`;

    // 宛先ブロック
    let toHtml = escHtml(clientName);
    if (clientPerson) toHtml += `　${escHtml(clientPerson)}　${escHtml(honorific)}`;
    else toHtml += `　${escHtml(honorific)}`;

    // 印刷HTMLを生成
    const printHtml = `
      <style>
        body { font-family: 'Noto Sans JP','Hiragino Kaku Gothic Pro','Meiryo',sans-serif; font-size:13px; color:#111; }
        #print-doc { padding: 0; }
        .p-title { text-align:center; font-size:28px; font-weight:bold; letter-spacing:0.3em; margin-bottom:20px; }
        .p-meta { display:flex; justify-content:space-between; margin-bottom:24px; }
        .p-to { font-size:18px; font-weight:bold; border-bottom:2px solid #111; padding-bottom:6px; margin-bottom:16px; }
        .p-total-box { border:2px solid #111; display:inline-block; padding:10px 24px; margin-bottom:24px; }
        .p-total-box .label { font-size:12px; color:#555; }
        .p-total-box .amount { font-size:22px; font-weight:bold; }
        table { width:100%; border-collapse:collapse; margin-bottom:16px; }
        th { background:#f0f0f0; border:1px solid #ccc; padding:7px 10px; font-size:12px; text-align:center; }
        td { border:1px solid #ccc; padding:7px 10px; font-size:13px; }
        td:first-child { width:45%; }
        .subtotal-row td { border-top:2px solid #aaa; }
        .grand-row td { font-weight:bold; background:#f9f9f9; }
        .p-memo { border:1px solid #ccc; padding:10px; min-height:60px; font-size:12px; white-space:pre-wrap; }
        .p-memo-label { font-size:11px; color:#555; margin-bottom:4px; }
        .p-issuer { text-align:right; }
        .p-meta-right { text-align:right; font-size:12px; color:#555; }
      </style>
      <div id="print-doc">
        <div class="p-title">${title}</div>
        <div class="p-meta">
          <div>
            <div class="p-to">${toHtml}</div>
            <div class="p-total-box">
              <div class="label">お支払い金額（税込）</div>
              <div class="amount">¥${total.toLocaleString('ja-JP')}</div>
            </div>
          </div>
          <div class="p-issuer p-meta-right">
            <div style="margin-bottom:4px;">発行日：${escHtml(issueDate)}</div>
            <div style="margin-bottom:12px;">文書番号：${escHtml(docNumber)}</div>
            ${issuerHtml}
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>品名</th>
              <th style="width:10%;">数量</th>
              <th style="width:18%;">単価</th>
              <th style="width:18%;">金額</th>
            </tr>
          </thead>
          <tbody>
            ${itemsHtml}
            <tr class="subtotal-row">
              <td colspan="3" style="text-align:right;font-size:12px;color:#555;">小計</td>
              <td style="text-align:right;">¥${subtotal.toLocaleString('ja-JP')}</td>
            </tr>
            <tr>
              <td colspan="3" style="text-align:right;font-size:12px;color:#555;">${taxLabel}</td>
              <td style="text-align:right;">¥${taxAmt.toLocaleString('ja-JP')}</td>
            </tr>
            <tr class="grand-row">
              <td colspan="3" style="text-align:right;">合計（税込）</td>
              <td style="text-align:right;">¥${total.toLocaleString('ja-JP')}</td>
            </tr>
          </tbody>
        </table>
        ${memo ? `<div class="p-memo-label">備考</div><div class="p-memo">${memo}</div>` : ''}
      </div>
    `;

    const printArea = document.getElementById('print-area');
    printArea.innerHTML = printHtml;

    // フォームエリアを一時非表示にして印刷
    document.getElementById('form-area').style.display = 'none';
    document.querySelector('.tabs').style.display = 'none';
    document.querySelector('.header').style.display = 'none';
    document.querySelector('.footer').style.display = 'none';
    printArea.style.display = 'block';

    window.print();

    // 印刷ダイアログを閉じたら元に戻す
    setTimeout(() => {
      document.getElementById('form-area').style.display = '';
      document.querySelector('.tabs').style.display = '';
      document.querySelector('.header').style.display = '';
      document.querySelector('.footer').style.display = '';
      printArea.style.display = 'none';
    }, 500);
  }

  /* ─── ユーティリティ ─── */
  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-');
    return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  }
</script>

</body>
</html>
