<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>参考図書リンク集</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

  :root {
    --bg: #f4f2ee;
    --surface: #ffffff;
    --border: #d8d3c8;
    --border-strong: #b0a898;
    --text: #1a1814;
    --text-sub: #6b6459;
    --text-mute: #9d9289;
    --accent: #2d5a3d;
    --accent-light: #e8f0ea;
    --accent2: #7a4f2d;
    --accent2-light: #f5ede6;
    --danger: #8b2e2e;
    --danger-light: #fceaea;
    --tag-bg: #ede9e2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ========== HEADER ========== */
  .site-header {
    background: var(--text);
    color: var(--bg);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .site-header .logo {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .site-header .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    padding: 2px 8px;
    letter-spacing: 0.05em;
  }
  .site-header .title {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .site-header .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #888;
  }
  .btn-settings {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    background: transparent;
    border: 1px solid #555;
    color: #ccc;
    padding: 5px 14px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .btn-settings:hover { border-color: #aaa; color: #fff; }

  /* ========== MAIN LAYOUT ========== */
  .main-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ========== SEARCH ========== */
  .search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }
  .search-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--text-mute); }

  /* ========== STATUS BAR ========== */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--text-mute);
    font-family: 'IBM Plex Mono', monospace;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-mute);
    flex-shrink: 0;
  }
  .status-dot.ok { background: #4caf50; }
  .status-dot.err { background: var(--danger); }
  .status-dot.loading {
    background: #f5a623;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ========== SECTION ========== */
  .section {
    margin-bottom: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .section-header:hover { background: #faf9f7; }
  .section-title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    letter-spacing: 0.05em;
  }
  /* ========== TAG TABS ========== */
  .tag-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 20px;
    border-bottom: 2px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tag-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    padding: 8px 16px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--text-sub);
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    white-space: nowrap;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

  .section-name {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .section-toggle {
    font-size: 18px;
    color: var(--text-mute);
    transition: transform 0.2s;
  }
  .section.collapsed .section-toggle { transform: rotate(-90deg); }
  .section.collapsed .section-body { display: none; }

  .section-body { padding: 0; }

  /* ========== DOCUMENT GROUP ========== */
  .doc-group {
    border-bottom: 1px solid var(--border);
  }
  .doc-group:last-child { border-bottom: none; }

  .doc-group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px 10px 24px;
    background: #faf9f7;
  }
  .doc-group-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-sub);
  }
  .doc-group-link {
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
    white-space: nowrap;
    margin-left: 12px;
    flex-shrink: 0;
  }
  .doc-group-link:hover { border-color: var(--accent); }

  /* ========== LINK ITEMS ========== */
  .link-list { padding: 4px 0; }
  .link-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px 8px 32px;
    transition: background 0.15s;
  }
  .link-item:hover { background: var(--accent-light); }
  .link-year {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
    min-width: 100px;
    flex-shrink: 0;
  }
  .link-label {
    font-size: 13px;
    color: var(--text);
    flex: 1;
  }
  .link-page {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    padding: 3px 10px;
    border: 1px solid var(--accent);
    letter-spacing: 0.03em;
    transition: all 0.2s;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .link-page:hover { background: var(--accent); color: #fff; }
  .link-pdf {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    text-decoration: none;
    padding: 3px 10px;
    border: 1px solid var(--accent2);
    letter-spacing: 0.05em;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .link-pdf:hover { background: var(--accent2); color: #fff; }
  .link-pdf.no-link {
    color: var(--text-mute);
    border-color: var(--border);
    pointer-events: none;
  }

  /* ========== EMPTY / ERROR STATES ========== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-mute);
    font-size: 14px;
  }
  .error-state {
    background: var(--danger-light);
    border: 1px solid var(--danger);
    padding: 20px 24px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--danger);
    line-height: 1.7;
  }
  .error-state strong { display: block; margin-bottom: 4px; font-size: 14px; }

  /* ========== SETUP PROMPT ========== */
  .setup-prompt {
    background: var(--accent-light);
    border: 1px solid var(--accent);
    padding: 32px 28px;
    text-align: center;
  }
  .setup-prompt h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--accent);
  }
  .setup-prompt p {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 20px;
    line-height: 1.7;
  }
  .btn-primary {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 28px;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.03em;
  }
  .btn-primary:hover { background: #234a30; }

  /* ========== MODAL ========== */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.active { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    padding: 36px 40px;
    width: 100%;
    max-width: 480px;
  }
  .modal h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .modal .modal-desc {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 20px;
    line-height: 1.7;
  }
  .modal label {
    display: block;
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 4px;
  }
  .modal input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    margin-bottom: 8px;
    outline: none;
    color: var(--text);
    background: var(--bg);
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-hint {
    font-size: 11px;
    color: var(--text-mute);
    margin-bottom: 20px;
    line-height: 1.6;
    background: var(--tag-bg);
    padding: 10px 12px;
  }
  .btn-row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .btn {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    padding: 8px 20px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
  }
  .btn:hover { background: var(--tag-bg); }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { background: var(--danger-light); }

  /* ========== FOOTER ========== */
  .site-footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: var(--text-mute);
    font-family: 'IBM Plex Mono', monospace;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  /* ========== TOOL DESC ========== */
  .tool-desc {
    margin: 0 0 10px;
    font-size: 13px;
    color: var(--text-mute);
    line-height: 1.5;
  }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 600px) {
    .site-header { padding: 0 14px; }
    .site-header .title { font-size: 13px; }
    .main-wrap { padding: 20px 14px 60px; }
    .link-item { flex-wrap: wrap; gap: 6px; }
    .link-year { min-width: 0; }
    .modal { padding: 24px 20px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="logo">
    <span class="badge">No.012</span>
    <span class="title">参考図書リンク集</span>
  </div>
  <div class="header-right">
    <span class="meta" id="headerMeta">v2.0</span>
    <button class="btn-settings" onclick="openSettings()">設定</button>
  </div>
</header>

<!-- MAIN -->
<div class="main-wrap">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="機関名・図書名で検索…" oninput="applyFilter()">
  </div>
  <p class="tool-desc">測量関連参考図書・準則のリンクを素早く参照できます。</p>
  <div id="tagTabs" class="tag-tabs" style="display:none;"></div>
  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">読み込み中...</span>
  </div>
  <div id="viewArea"></div>
</div>

<footer class="site-footer">
  arisa-tools — No.012 参考図書リンク集 v2.0 — データソース: Google Sheets
</footer>

<!-- SETTINGS MODAL -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h2>シートURL設定</h2>
    <div class="modal-desc">
      Google Sheets を「ウェブに公開（CSV形式）」して取得したURLを入力してください。<br>
      URLはこのブラウザのみに保存されます。データは保存されません。
    </div>
    <label>CSV公開URL</label>
    <input type="text" id="sheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv">
    <div class="modal-hint">
      取得方法: Googleスプレッドシート → ファイル → 共有 → ウェブに公開<br>
      → 「リンク」タブ → 形式を「カンマ区切り形式（.csv）」に変更 → URLをコピー
    </div>
    <div class="btn-row">
      <button class="btn danger" onclick="clearSettings()">URLをクリア</button>
      <button class="btn" onclick="closeSettings()">キャンセル</button>
      <button class="btn-primary" onclick="saveSettings()">保存して再読み込み</button>
    </div>
  </div>
</div>

<script>
// ========== CONSTANTS ==========
const SHEET_URL_KEY = 'tl012_sheet_url';

// ========== STATE ==========
let allRows = [];          // CSVパース後の全行データ
let filteredSections = [];
let currentTag = 'all';    // 選択中のタグ（'all' or raw tag値）
let tagRegistry = {};      // raw tag値 → { bg, color } のマップ

// タグ自動配色パレット
const TAG_PALETTE = [
  { bg: '#ddeeff', color: '#1a4a7a' },
  { bg: '#ddf0e2', color: '#1a5a2e' },
  { bg: '#fff0d8', color: '#7a4a00' },
  { bg: '#f0e8ff', color: '#4a1a7a' },
  { bg: '#fde8e8', color: '#7a1a1a' },
  { bg: '#e8f5fd', color: '#1a5a6a' },
  { bg: '#fdf5e8', color: '#6a4a1a' },
  { bg: '#e8fde8', color: '#1a6a2a' },
  { bg: '#f5e8fd', color: '#5a1a6a' },
  { bg: '#fdeee8', color: '#6a2a1a' },
];

// ========== SHEET URL ==========
function getSheetUrl() {
  return localStorage.getItem(SHEET_URL_KEY) || '';
}

function openSettings() {
  document.getElementById('sheetUrlInput').value = getSheetUrl();
  document.getElementById('settingsOverlay').classList.add('active');
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('active');
}

function saveSettings() {
  const url = document.getElementById('sheetUrlInput').value.trim();
  localStorage.setItem(SHEET_URL_KEY, url);
  closeSettings();
  loadData();
}

function clearSettings() {
  if (!confirm('シートURLをクリアしますか？')) return;
  localStorage.removeItem(SHEET_URL_KEY);
  document.getElementById('sheetUrlInput').value = '';
  closeSettings();
  loadData();
}

// ========== CSV PARSE ==========
// RFC 4180準拠のシンプルなCSVパーサー
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuote = false;
  let i = 0;

  while (i < text.length) {
    const ch = text[i];
    if (inQuote) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuote = false;
      } else {
        field += ch;
      }
    } else {
      if (ch === '"') {
        inQuote = true;
      } else if (ch === ',') {
        row.push(field.trim());
        field = '';
      } else if (ch === '\r') {
        // skip
      } else if (ch === '\n') {
        row.push(field.trim());
        if (row.some(f => f !== '')) rows.push(row);
        row = [];
        field = '';
        i++;
        continue;
      } else {
        field += ch;
      }
    }
    i++;
  }
  // 最終行
  row.push(field.trim());
  if (row.some(f => f !== '')) rows.push(row);

  return rows;
}

// ========== BUILD STRUCTURE ==========
// CSV行をsection > group > link の階層に変換
// 列: A=section, B=group, C=page_url, D=year, E=label, F=pdf_url, G=tag
function buildStructure(rows) {
  // ヘッダー行をスキップ
  const dataRows = rows.slice(1).filter(r => r.length >= 5 && r[0]);

  const sectionsMap = new Map(); // section名 → sectionオブジェクト
  const groupsMap = new Map();   // "section::group" → groupオブジェクト

  dataRows.forEach(r => {
    const sectionName = r[0] || '';
    const groupName   = r[1] || '';
    const pageUrl     = r[2] || '';
    const year        = r[3] || '';
    const label       = r[4] || '';
    const pdfUrl      = r[5] || '';
    const tagKey      = r[6] || 'その他';

    if (!sectionName) return;

    // セクション
    if (!sectionsMap.has(sectionName)) {
      sectionsMap.set(sectionName, {
        name: sectionName,
        tag: tagKey || 'その他',
        groups: []
      });
    }
    const section = sectionsMap.get(sectionName);

    if (!groupName) return;

    // グループ
    const grpKey = sectionName + '::' + groupName;
    if (!groupsMap.has(grpKey)) {
      const grp = { name: groupName, pageUrl, links: [] };
      groupsMap.set(grpKey, grp);
      section.groups.push(grp);
    }
    const group = groupsMap.get(grpKey);
    // page_urlは最初に登場したもの（複数行に同じグループが続く場合も同一とみなす）
    if (!group.pageUrl && pageUrl) group.pageUrl = pageUrl;

    if (year || label) {
      group.links.push({ year, label, pdfUrl });
    }
  });

  return Array.from(sectionsMap.values());
}

// CSVデータからタグ一覧を収集し、パレットから色を自動割り当て
function buildTagRegistry(sections) {
  const seen = new Set();
  const ordered = [];
  sections.forEach(sec => {
    if (!seen.has(sec.tag)) { seen.add(sec.tag); ordered.push(sec.tag); }
  });
  const reg = {};
  ordered.forEach((tag, i) => {
    reg[tag] = TAG_PALETTE[i % TAG_PALETTE.length];
  });
  return reg;
}

// タグのインラインスタイル文字列を返す
function tagStyle(tag) {
  const c = tagRegistry[tag];
  if (!c) return `background:var(--tag-bg);color:var(--text-sub);`;
  return `background:${c.bg};color:${c.color};`;
}

// ========== LOAD ==========
async function loadData() {
  const url = getSheetUrl();

  if (!url) {
    renderSetupPrompt();
    setStatus('no-url', '');
    return;
  }

  setStatus('loading', 'データを読み込んでいます…');

  try {
    // CORS対策: Google Sheets CSV公開URLはno-corsでは使えないため直接fetchする
    // （GAS経由の場合も同じ方法）
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const rows = parseCSV(text);

    if (rows.length <= 1) {
      allRows = [];
      renderEmpty('シートにデータがありません');
      setStatus('ok', 'データなし');
      return;
    }

    allRows = buildStructure(rows);
    tagRegistry = buildTagRegistry(allRows);
    currentTag = 'all';
    renderTabs();
    applyFilter();
    const count = rows.length - 1;
    setStatus('ok', `${count} 件読み込み完了`);
  } catch (e) {
    allRows = [];
    renderError(e);
    setStatus('err', 'データ取得失敗');
  }
}

// ========== TABS ==========
function renderTabs() {
  const el = document.getElementById('tagTabs');
  const tags = Object.keys(tagRegistry);
  if (!tags.length) { el.style.display = 'none'; return; }

  let html = `<button class="tab-btn ${currentTag === 'all' ? 'active' : ''}" onclick="setActiveTag('all')">すべて</button>`;
  tags.forEach(tag => {
    const active = currentTag === tag ? 'active' : '';
    html += `<button class="tab-btn ${active}" onclick="setActiveTag(${JSON.stringify(tag)})">${escHtml(tag)}</button>`;
  });
  el.innerHTML = html;
  el.style.display = 'flex';
}

function setActiveTag(tag) {
  currentTag = tag;
  renderTabs();
  applyFilter();
}

// ========== FILTER ==========
function applyFilter() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  if (!allRows.length) return;

  filteredSections = allRows.filter(sec => {
    return currentTag === 'all' || sec.tag === currentTag;
  }).map(sec => {
    const secMatch = sec.name.toLowerCase().includes(q);
    const filteredGroups = sec.groups.map(grp => {
      const grpMatch = grp.name.toLowerCase().includes(q);
      const linkMatch = grp.links.some(l =>
        l.year.toLowerCase().includes(q) || l.label.toLowerCase().includes(q)
      );
      if (q && !secMatch && !grpMatch && !linkMatch) return null;
      return grp;
    }).filter(Boolean);

    if (q && !secMatch && !filteredGroups.length) return null;
    return { ...sec, groups: filteredGroups };
  }).filter(Boolean);

  renderView();
}

// ========== RENDER ==========
function renderView() {
  const area = document.getElementById('viewArea');

  if (!filteredSections.length) {
    const q = document.getElementById('searchInput').value.trim();
    area.innerHTML = `<div class="empty-state">${q ? `「${escHtml(q)}」に一致する図書が見つかりませんでした` : 'データがありません'}</div>`;
    return;
  }

  let html = '';
  filteredSections.forEach((sec, si) => {
    let groupsHtml = '';

    sec.groups.forEach(grp => {
      let linksHtml = '';
      grp.links.forEach(lnk => {
        const pageBtn = lnk.pdfUrl
          ? `<a class="link-pdf" href="${escAttr(safeUrl(lnk.pdfUrl))}" target="_blank" rel="noopener">PDF</a>`
          : `<span class="link-pdf no-link">PDF未登録</span>`;
        linksHtml += `
          <div class="link-item">
            <span class="link-year">${escHtml(lnk.year)}</span>
            <span class="link-label">${escHtml(lnk.label)}</span>
            ${pageBtn}
          </div>`;
      });

      const pageLink = grp.pageUrl
        ? `<a class="doc-group-link" href="${escAttr(safeUrl(grp.pageUrl))}" target="_blank" rel="noopener">掲載ページ →</a>`
        : '';

      groupsHtml += `
        <div class="doc-group">
          <div class="doc-group-header">
            <span class="doc-group-title">${escHtml(grp.name)}</span>
            ${pageLink}
          </div>
          <div class="link-list">${linksHtml || '<div style="padding:10px 32px;font-size:12px;color:var(--text-mute);">リンク未登録</div>'}</div>
        </div>`;
    });

    html += `
      <div class="section" id="section-${si}">
        <div class="section-header" onclick="toggleSection(${si})">
          <div class="section-title-wrap">
            <span class="section-tag" style="${tagStyle(sec.tag)}">${escHtml(sec.tag)}</span>
            <span class="section-name">${escHtml(sec.name)}</span>
          </div>
          <span class="section-toggle">▾</span>
        </div>
        <div class="section-body">
          ${groupsHtml || '<div style="padding:16px 18px;font-size:12px;color:var(--text-mute);">グループ未登録</div>'}
        </div>
      </div>`;
  });

  area.innerHTML = html;
}

function toggleSection(idx) {
  const el = document.getElementById('section-' + idx);
  if (el) el.classList.toggle('collapsed');
}

function renderSetupPrompt() {
  document.getElementById('viewArea').innerHTML = `
    <div class="setup-prompt">
      <h2>シートURLを設定してください</h2>
      <p>
        Google Sheetsで管理している図書データのCSV公開URLを設定すると、<br>
        ツールが自動でデータを読み込みます。<br>
        設定したURLはこのブラウザにのみ保存されます。
      </p>
      <button class="btn-primary" onclick="openSettings()">URLを設定する</button>
    </div>`;
}

function renderError(err) {
  document.getElementById('viewArea').innerHTML = `
    <div class="error-state">
      <strong>データの取得に失敗しました</strong>
      シートの公開設定（ウェブに公開 → CSV形式）を確認してください。<br>
      また、URLが正しいかご確認ください。<br>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:6px;display:block;color:var(--text-mute);">${escHtml(String(err))}</span>
    </div>`;
}

function renderEmpty(msg) {
  document.getElementById('viewArea').innerHTML = `<div class="empty-state">${escHtml(msg)}</div>`;
}

// ========== STATUS ==========
function setStatus(type, text) {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusText');
  dot.className = 'status-dot';
  if (type === 'ok')      { dot.classList.add('ok');      }
  if (type === 'err')     { dot.classList.add('err');     }
  if (type === 'loading') { dot.classList.add('loading'); }
  label.textContent = text;

  // ヘッダーメタ更新
  if (type === 'ok') {
    const now = new Date();
    const ts = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} 更新`;
    document.getElementById('headerMeta').textContent = ts;
  }
}

// ========== ESCAPE ==========
function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function escAttr(s) { return escHtml(s); }
function safeUrl(s) {
  if (/^https?:\/\//i.test(s)) return s;
  return '#';
}

// ========== INIT ==========
loadData();
</script>
