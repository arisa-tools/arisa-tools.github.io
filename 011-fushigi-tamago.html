<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>デジタルモンスター Ver.1</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #1a1a2e;
  --panel: #252540;
  --screen: #b8c890;
  --screen-dark: #1a2a08;
  --text: #e8e8ff;
  --accent: #4a8aff;
  --border: #3a3a6a;
  --shadow: 0 4px 20px rgba(0,0,0,0.5);
}
body {
  font-family: "Courier New", monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 12px;
  user-select: none;
  -webkit-user-select: none;
}
.container { max-width: 360px; margin: 0 auto; }

/* ヘッダー */
.hdr { text-align: center; padding: 8px 0 10px; }
.hdr-title { font-size: 17px; font-weight: 700; letter-spacing: 3px; color: var(--accent); text-shadow: 0 0 10px rgba(74,138,255,0.6); }
.hdr-sub { font-size: 9px; color: #6666aa; letter-spacing: 3px; margin-top: 2px; }

/* LCDスクリーン */
.screen-wrap {
  background: #2e1e0a;
  border-radius: 14px;
  padding: 8px;
  margin-bottom: 10px;
  box-shadow: var(--shadow), inset 0 0 0 2px #5a3a18;
}
.screen {
  background: var(--screen);
  border-radius: 8px;
  padding: 8px 10px 6px;
  position: relative;
  min-height: 170px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.screen-top {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  min-height: 18px;
  margin-bottom: 2px;
}
.screen-alert {
  font-size: 11px;
  font-weight: 700;
  color: var(--screen-dark);
  animation: alertBlink 0.4s ease-in-out infinite;
  letter-spacing: 1px;
}
@keyframes alertBlink { 0%,100%{opacity:1} 50%{opacity:0} }
.screen-icons { font-size: 13px; display: flex; gap: 4px; }
.screen-mon {
  width: 100px;
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.screen-mon svg {
  width: 100px;
  height: 100px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.poop-row { display: flex; gap: 3px; min-height: 16px; margin-top: 2px; font-size: 13px; }
.screen-msg {
  font-size: 10px;
  font-weight: 700;
  color: var(--screen-dark);
  text-align: center;
  min-height: 14px;
  letter-spacing: 0.5px;
  margin-top: 3px;
}

/* ステータス */
.stat-panel {
  background: var(--panel);
  border-radius: 10px;
  padding: 9px 12px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
}
.stat-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
}
.stat-row:last-child { margin-bottom: 0; }
.stat-lbl { font-size: 9px; color: #7777aa; letter-spacing: 1px; width: 44px; flex-shrink: 0; }
.hearts { display: flex; gap: 3px; }
.heart { font-size: 11px; line-height: 1; }
.stat-nums {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: #6666aa;
  padding-top: 6px;
  margin-top: 4px;
  border-top: 1px solid var(--border);
}
.stat-num-v { color: var(--text); font-weight: 700; }
.stat-num-v.danger { color: #ff5555; }

/* アクションボタン */
.btn-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}
.abtn {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 3px 8px;
  font-size: 9px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  letter-spacing: 0.3px;
  transition: all 0.1s;
}
.abtn .ico { font-size: 19px; }
.abtn:active { background: var(--accent); border-color: var(--accent); transform: scale(0.93); }
.abtn.flash { animation: btnFlash 0.6s ease-in-out infinite; border-color: #ff5555; }
@keyframes btnFlash { 0%,100%{border-color:#ff5555} 50%{border-color:var(--border)} }
.abtn:disabled { opacity: 0.3; cursor: not-allowed; }

/* バトルパネル */
.battle-panel {
  display: none;
  background: var(--panel);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  border: 1px solid var(--accent);
  text-align: center;
}
.battle-panel.on { display: block; }
.battle-title { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 3px; margin-bottom: 8px; }
.battle-stage { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 8px; }
.battle-mon { width: 64px; height: 64px; }
.battle-mon svg { width: 64px; height: 64px; image-rendering: pixelated; }
.battle-vs { font-size: 14px; font-weight: 700; color: #ff6a00; }
.battle-msg { font-size: 11px; color: var(--text); margin-bottom: 8px; min-height: 16px; }
.battle-btns { display: flex; gap: 6px; }
.bbtn {
  flex: 1;
  background: #1e2e4a;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 10px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: all 0.1s;
}
.bbtn:active { background: var(--accent); transform: scale(0.95); }

/* 進化演出 */
.evo-overlay {
  position: fixed; inset: 0;
  background: rgba(255,255,255,0.97);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100;
}
.evo-overlay.on { display: flex; animation: evoFlash 0.5s; }
@keyframes evoFlash { from{opacity:0} to{opacity:1} }
.evo-mon { width: 120px; height: 120px; }
.evo-mon svg { width: 120px; height: 120px; image-rendering: pixelated; }
.evo-txt { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-top: 14px; text-align: center; letter-spacing: 2px; white-space: pre-line; line-height: 1.8; }

/* 確認モーダル */
.modal-wrap {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.65);
  display: none; align-items: center; justify-content: center;
  z-index: 200; padding: 20px;
}
.modal-wrap.on { display: flex; }
.modal {
  background: var(--panel);
  border-radius: 12px;
  padding: 20px;
  max-width: 280px; width: 100%;
  border: 1px solid var(--border);
}
.modal-txt { font-size: 13px; text-align: center; color: var(--text); margin-bottom: 14px; line-height: 1.7; white-space: pre-line; }
.modal-btns { display: flex; gap: 8px; }
.mbtn { flex:1; padding:10px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; border:none; }
.mbtn.cancel { background:#2a2a4a; color:var(--text); }
.mbtn.ok { background:#cc3333; color:#fff; }

/* 設定 */
.settings {
  display: none;
  background: var(--panel);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
}
.settings.on { display: block; }
.set-title { font-size: 9px; color: #6666aa; letter-spacing: 2px; margin-bottom: 8px; }
.set-row { margin-bottom: 8px; }
.set-lbl { font-size: 10px; color: #9999bb; margin-bottom: 4px; }
.set-btns { display: flex; gap: 4px; }
.sbtn {
  flex:1; background:#1a1a3a; border:1px solid var(--border);
  border-radius:6px; padding:6px 4px; font-size:10px; color:var(--text); cursor:pointer;
}
.sbtn.sel { background: var(--accent); border-color: var(--accent); }
.dbtn {
  width:100%; background:transparent; border:1px solid #cc3333;
  border-radius:8px; padding:8px; font-size:11px; color:#cc3333;
  cursor:pointer; font-weight:700; font-family:inherit;
}
.dbtn:active { background:#cc3333; color:#fff; }
.toggle-set {
  width:100%; background:var(--panel); border:1px solid var(--border);
  border-radius:8px; padding:8px; font-size:9px; color:#6666aa;
  cursor:pointer; letter-spacing:2px; margin-bottom:8px; font-family:inherit;
}
.footer { text-align:center; font-size:9px; color:#333355; padding:6px 0 12px; letter-spacing:1px; }

/* モンスターアニメーション */
.mon-bounce { animation: bounce 1.8s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
.mon-sleep { animation: sleepBreath 2.5s ease-in-out infinite; }
@keyframes sleepBreath { 0%,100%{transform:scale(1)} 50%{transform:scale(0.97)} }
.mon-sick { filter: saturate(0.2) brightness(0.7); animation: sickShake 0.5s ease-in-out infinite; }
@keyframes sickShake { 0%,100%{transform:translateX(0)} 33%{transform:translateX(-2px)} 66%{transform:translateX(2px)} }
</style>
</head>
<body>
<div class="container">

  <div class="hdr">
    <div class="hdr-title">DIGITAL MONSTER</div>
    <div class="hdr-sub">VER.1</div>
  </div>

  <div class="screen-wrap">
    <div class="screen">
      <div class="screen-top">
        <div class="screen-alert" id="sAlert" style="visibility:hidden">！！</div>
        <div class="screen-icons" id="sIcons"></div>
      </div>
      <div class="screen-mon" id="sMon"></div>
      <div class="poop-row" id="sPoops"></div>
      <div class="screen-msg" id="sMsg">たまごが やってきた！</div>
    </div>
  </div>

  <div class="stat-panel">
    <div class="stat-row">
      <span class="stat-lbl">まんぷく</span>
      <div class="hearts" id="hHunger"></div>
    </div>
    <div class="stat-row">
      <span class="stat-lbl">きげん</span>
      <div class="hearts" id="hHappy"></div>
    </div>
    <div class="stat-nums">
      <span>たいじゅう: <span class="stat-num-v" id="vWeight">10</span>g</span>
      <span>ねんれい: <span class="stat-num-v" id="vAge">0</span>さい</span>
      <span>ケアミス: <span class="stat-num-v danger" id="vMistake">0</span></span>
      <span>しょうり: <span class="stat-num-v" id="vWins">0</span></span>
    </div>
  </div>

  <div class="btn-grid">
    <button class="abtn" id="bFood"   onclick="aFood()">  <span class="ico">🍖</span><span>しょくじ</span></button>
    <button class="abtn" id="bLight"  onclick="aLight()"> <span class="ico">💡</span><span>でんとう</span></button>
    <button class="abtn" id="bPlay"   onclick="aPlay()">  <span class="ico">⚔️</span><span>バトル</span></button>
    <button class="abtn" id="bMed"    onclick="aMed()">   <span class="ico">💊</span><span>くすり</span></button>
    <button class="abtn" id="bClean"  onclick="aClean()"> <span class="ico">🚿</span><span>おふろ</span></button>
    <button class="abtn" id="bStatus" onclick="aStatus()"><span class="ico">📊</span><span>じょうたい</span></button>
    <button class="abtn" id="bDisc"   onclick="aDisc()">  <span class="ico">😤</span><span>しつけ</span></button>
    <button class="abtn"              onclick="toggleSet()"><span class="ico">⚙️</span><span>せってい</span></button>
  </div>

  <div class="battle-panel" id="battlePanel">
    <div class="battle-title">BATTLE！</div>
    <div class="battle-stage">
      <div class="battle-mon" id="bMyMon"></div>
      <div class="battle-vs">VS</div>
      <div class="battle-mon" id="bEnemyMon"></div>
    </div>
    <div class="battle-msg" id="bMsg">こうどうを えらべ！</div>
    <div class="battle-btns" id="bBtns">
      <button class="bbtn" onclick="doBattle('attack')">こうげき</button>
      <button class="bbtn" onclick="doBattle('guard')">まもる</button>
    </div>
  </div>

  <button class="toggle-set" onclick="toggleSet()">▶ SETTINGS</button>
  <div class="settings" id="settingsPanel">
    <div class="set-title">SETTINGS</div>
    <div class="set-row">
      <div class="set-lbl">ゲームスピード</div>
      <div class="set-btns">
        <button class="sbtn" data-sp="fast"   onclick="setSpeed('fast')">はやい</button>
        <button class="sbtn" data-sp="normal" onclick="setSpeed('normal')">ふつう</button>
        <button class="sbtn" data-sp="slow"   onclick="setSpeed('slow')">ゆっくり</button>
      </div>
    </div>
    <div class="set-row">
      <button class="dbtn" onclick="doReset()">最初からやり直す</button>
    </div>
  </div>

  <div class="footer">DIGITAL MONSTER Ver.1 Clone</div>
</div>

<!-- 進化演出 -->
<div class="evo-overlay" id="evoOverlay">
  <div class="evo-mon" id="evoMon"></div>
  <div class="evo-txt" id="evoTxt"></div>
</div>

<!-- 確認モーダル -->
<div class="modal-wrap" id="confirmModal">
  <div class="modal">
    <div class="modal-txt" id="confirmTxt">よろしいですか？</div>
    <div class="modal-btns">
      <button class="mbtn cancel" id="confirmNo">キャンセル</button>
      <button class="mbtn ok"     id="confirmYes">OK</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// デジタルモンスター Ver.1 クローン
// ============================================================

const ST = {
  EGG:   'egg',
  BOTA:  'botamon',
  KORO:  'koromon',
  AGUM:  'agumon',
  GREY:  'greymon',
  SKULL: 'skullgreymon',
  METAL: 'metalgreymon'
};

const NAMES = {
  egg:'たまご', botamon:'ボタモン', koromon:'コロモン',
  agumon:'アグモン', greymon:'グレイモン',
  skullgreymon:'スカルグレイモン', metalgreymon:'メタルグレイモン'
};

// スピード設定（秒）
const SP = {
  fast: {
    hungerTick: 120, happyTick: 180, poopInterval: 90, alertTimeout: 300,
    evo: { botamon:30, koromon:180, agumon:360, adult:900 }
  },
  normal: {
    hungerTick: 900, happyTick: 1200, poopInterval: 600, alertTimeout: 1800,
    evo: { botamon:300, koromon:1800, agumon:10800, adult:28800 }
  },
  slow: {
    hungerTick: 3600, happyTick: 5400, poopInterval: 2400, alertTimeout: 7200,
    evo: { botamon:1800, koromon:7200, agumon:43200, adult:86400 }
  }
};

let G = defaultState();

function defaultState() {
  return {
    stage: ST.EGG,
    hunger: 4, happy: 4,
    weight: 10, age: 0,
    careMistakes: 0, trainingWins: 0, totalFeeds: 0,
    poopCount: 0, isSick: false,
    isSleeping: false, lightOn: true,
    alertActive: false, alertType: null, alertStart: null,
    stageStart: Date.now(),
    hatchPct: 0,
    birthTime: Date.now(),
    lastHungerTick: Date.now(),
    lastHappyTick:  Date.now(),
    lastPoopTick:   Date.now(),
    lastAgeTick:    Date.now(),
    battleOn: false, battleEnemy: 0,
    battleMyHp: 3, battleEnemyHp: 3, battleRound: 0,
    speed: 'normal',
    lastSave: Date.now()
  };
}

const SAVE_KEY = 'digi_v1_clone';

function save() {
  G.lastSave = Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(G));
}

function load() {
  const s = localStorage.getItem(SAVE_KEY);
  if (!s) return;
  try {
    G = Object.assign(defaultState(), JSON.parse(s));
    applyOffline();
  } catch(e) {}
}

function applyOffline() {
  const now = Date.now();
  const elapsed = (now - G.lastSave) / 1000;
  if (elapsed <= 0 || G.stage === ST.EGG || G.isSleeping) return;
  const sp = SP[G.speed] || SP.normal;
  const hungerLost = Math.floor(elapsed / sp.hungerTick);
  const happyLost  = Math.floor(elapsed / sp.happyTick);
  G.hunger = Math.max(0, G.hunger - hungerLost);
  G.happy  = Math.max(0, G.happy  - happyLost);
  if (G.alertActive && G.alertStart) {
    const ae = (now - G.alertStart) / 1000;
    if (ae > sp.alertTimeout) {
      G.careMistakes++;
      G.alertActive = false; G.alertType = null; G.alertStart = null;
    }
  }
}

function doReset() {
  confirm2('本当に最初からやり直しますか？', () => {
    localStorage.removeItem(SAVE_KEY);
    const spd = G.speed;
    G = defaultState();
    G.speed = spd;
    showMsg('あたらしい たまごが やってきた！');
    render(); save();
  });
}

// ----- メインループ -----
function tick() {
  const now = Date.now();
  const sp = SP[G.speed] || SP.normal;

  if (G.stage === ST.EGG) {
    const hatchSec = G.speed === 'fast' ? 30 : G.speed === 'slow' ? 1800 : 180;
    G.hatchPct = Math.min(100, G.hatchPct + (100 / hatchSec));
    if (G.hatchPct >= 100) doHatch();
    render(); save(); return;
  }

  if (G.isSleeping) { render(); return; }

  // 空腹減衰
  if (now - G.lastHungerTick >= sp.hungerTick * 1000) {
    G.lastHungerTick = now;
    if (G.hunger > 0) {
      G.hunger--;
      if (G.hunger === 0) trigAlert('hungry');
    }
  }

  // きげん減衰
  if (now - G.lastHappyTick >= sp.happyTick * 1000) {
    G.lastHappyTick = now;
    if (G.happy > 0) {
      G.happy--;
      if (G.happy === 0) trigAlert('unhappy');
    }
  }

  // うんち
  if (G.totalFeeds > 0 && G.poopCount < 3) {
    if (now - G.lastPoopTick >= sp.poopInterval * 1000) {
      G.lastPoopTick = now;
      G.poopCount = Math.min(3, G.poopCount + 1);
      if (G.poopCount >= 3 && !G.isSick) {
        G.isSick = true;
        trigAlert('sick');
      }
    }
  }

  // アラートタイムアウト
  if (G.alertActive && G.alertStart) {
    const ae = (now - G.alertStart) / 1000;
    if (ae > sp.alertTimeout) {
      G.careMistakes++;
      G.alertActive = false; G.alertType = null; G.alertStart = null;
      if (G.careMistakes % 3 === 0 && !G.isSick) {
        G.isSick = true;
        trigAlert('sick');
      }
    }
  }

  // 年齢カウント（hungerTick×4を1日とする）
  const dayLen = sp.hungerTick * 4;
  if (now - G.lastAgeTick >= dayLen * 1000) {
    G.age++;
    G.lastAgeTick = now;
  }

  checkEvo();
  render(); save();
}

function trigAlert(type) {
  if (G.alertActive) return;
  G.alertActive = true; G.alertType = type; G.alertStart = Date.now();
}

function clearAlert() {
  G.alertActive = false; G.alertType = null; G.alertStart = null;
}

// ----- 孵化 -----
function doHatch() {
  G.stage = ST.BOTA;
  G.stageStart = Date.now();
  G.hunger = 4; G.happy = 4; G.weight = 5;
  showEvo('ボタモン に\nうまれた！');
  save();
}

// ----- 進化判定 -----
function checkEvo() {
  const sp = SP[G.speed] || SP.normal;
  const elapsed = (Date.now() - G.stageStart) / 1000;

  if (G.stage === ST.BOTA && elapsed >= sp.evo.botamon) {
    doEvo(ST.KORO, 10, 'コロモン に\nしんかした！');
  } else if (G.stage === ST.KORO && elapsed >= sp.evo.koromon) {
    doEvo(ST.AGUM, 15, 'アグモン に\nしんかした！');
  } else if (G.stage === ST.AGUM && elapsed >= sp.evo.agumon) {
    // Adult分岐：ケアミス≥5 or 体重範囲外でスカル
    if (G.careMistakes >= 5 || G.weight < 8 || G.weight > 45) {
      doEvo(ST.SKULL, 20, 'スカルグレイモン に\nしんかした…');
    } else {
      doEvo(ST.GREY, 20, 'グレイモン に\nしんかした！');
    }
  } else if (G.stage === ST.GREY && elapsed >= sp.evo.adult) {
    // Perfect：ケアミス≤2 & 勝利≥10 & 適正体重
    if (G.careMistakes <= 2 && G.trainingWins >= 10 && G.weight >= 15 && G.weight <= 40) {
      doEvo(ST.METAL, 25, 'メタルグレイモン に\nしんかした！！');
    }
    // 条件不足ならグレイモンのまま
  }
}

function doEvo(next, baseWeight, txt) {
  G.stage = next;
  G.stageStart = Date.now();
  G.hunger = 4; G.happy = 4;
  G.weight = baseWeight;
  showEvo(txt);
  save();
}

// ----- アクション -----
function aFood() {
  if (G.stage === ST.EGG) { showMsg('たまごには まだ…'); return; }
  if (G.isSleeping) { showMsg('ねてるよ…'); return; }
  if (G.hunger >= 4) {
    G.weight = Math.min(99, G.weight + 3);
    showMsg('おやつを たべた！ むきむき？');
  } else {
    G.hunger = Math.min(4, G.hunger + 1);
    G.weight = Math.min(99, G.weight + 2);
    G.totalFeeds++;
    G.lastPoopTick = Date.now(); // うんちタイマーリセット
    showMsg('もぐもぐ！');
  }
  if (G.alertActive && G.alertType === 'hungry') clearAlert();
  render(); save();
}

function aLight() {
  if (G.stage === ST.EGG) { showMsg('たまごには まだ…'); return; }
  if (G.isSleeping) {
    G.isSleeping = false; G.lightOn = true;
    if (G.alertActive && G.alertType === 'wakeup') clearAlert();
    showMsg('おはよう！');
  } else {
    G.isSleeping = true; G.lightOn = false;
    showMsg('おやすみ…');
  }
  render(); save();
}

function aPlay() {
  if (G.stage === ST.EGG || G.stage === ST.BOTA || G.stage === ST.KORO) {
    showMsg('まだ バトルは できないよ'); return;
  }
  if (G.isSleeping) { showMsg('ねてるよ…'); return; }
  if (G.battleOn) return;
  startBattle();
}

function aMed() {
  if (!G.isSick) { showMsg('げんきだよ！'); return; }
  G.isSick = false;
  if (G.alertActive && G.alertType === 'sick') clearAlert();
  showMsg('くすりを のんだ！ よくなった！');
  render(); save();
}

function aClean() {
  if (G.stage === ST.EGG) { showMsg('たまごを みがいた'); return; }
  if (G.poopCount === 0) { showMsg('きれいだよ！'); return; }
  G.poopCount = 0;
  G.lastPoopTick = Date.now();
  if (G.alertActive && G.alertType === 'poop') clearAlert();
  showMsg('ピカピカ！');
  render(); save();
}

function aStatus() {
  const nm = NAMES[G.stage] || G.stage;
  showMsg(nm + ' ' + G.age + 'さい ' + G.weight + 'g');
}

function aDisc() {
  // きげんが十分あるのにアラートを出しているときはわがまま→しつけ有効
  if (G.alertActive && G.alertType === 'unhappy' && G.happy >= 2) {
    clearAlert();
    showMsg('こらっ！');
  } else {
    showMsg('しつけは いまは ひつようない');
  }
  render(); save();
}

function toggleSet() {
  document.getElementById('settingsPanel').classList.toggle('on');
}

function setSpeed(sp) {
  G.speed = sp;
  document.querySelectorAll('[data-sp]').forEach(b =>
    b.classList.toggle('sel', b.dataset.sp === sp)
  );
  const now = Date.now();
  G.lastHungerTick = now; G.lastHappyTick = now;
  G.lastPoopTick = now;
  save();
}

// ----- バトル -----
const ENEMIES = [
  { name:'コロモン',   svgFn: () => svgKoromon()  },
  { name:'アグモン',   svgFn: () => svgAgumon()   },
  { name:'グレイモン', svgFn: () => svgGreymon()  }
];

function startBattle() {
  G.battleOn = true;
  G.battleEnemy = Math.floor(Math.random() * ENEMIES.length);
  G.battleMyHp = 3; G.battleEnemyHp = 3; G.battleRound = 0;
  renderBattle();
  document.getElementById('battlePanel').classList.add('on');
  document.getElementById('bBtns').style.display = 'flex';
}

function doBattle(choice) {
  if (!G.battleOn) return;
  const cpu = Math.random() < 0.5 ? 'attack' : 'guard';
  let msg = '';
  if (choice === 'attack' && cpu === 'attack') {
    G.battleMyHp--; G.battleEnemyHp--; msg = 'おたがい ダメージ！';
  } else if (choice === 'attack' && cpu === 'guard') {
    msg = 'まもられた！';
  } else if (choice === 'guard' && cpu === 'attack') {
    msg = 'まもった！';
  } else {
    msg = 'おたがい まもった';
  }
  G.battleRound++;
  document.getElementById('bMsg').textContent = msg;
  setTimeout(() => {
    if (G.battleMyHp <= 0 || G.battleEnemyHp <= 0 || G.battleRound >= 5) {
      endBattle();
    } else {
      document.getElementById('bMsg').textContent = 'ラウンド ' + (G.battleRound + 1);
      renderBattle();
    }
  }, 900);
}

function endBattle() {
  const won = G.battleMyHp > G.battleEnemyHp ||
    (G.battleMyHp === G.battleEnemyHp && G.battleRound >= 5 && Math.random() < 0.5);
  document.getElementById('bBtns').style.display = 'none';
  if (won) {
    G.trainingWins++;
    G.happy = Math.min(4, G.happy + 1);
    G.weight = Math.max(1, G.weight - 1);
    document.getElementById('bMsg').textContent = 'かった！！ ＋1しょうり';
    if (G.alertActive && G.alertType === 'unhappy') clearAlert();
  } else {
    G.happy = Math.max(0, G.happy - 1);
    document.getElementById('bMsg').textContent = 'まけた… がんばれ！';
  }
  setTimeout(() => {
    G.battleOn = false;
    document.getElementById('battlePanel').classList.remove('on');
    render(); save();
  }, 2000);
}

function renderBattle() {
  document.getElementById('bMyMon').innerHTML    = monSVG(G.stage, 64);
  document.getElementById('bEnemyMon').innerHTML = ENEMIES[G.battleEnemy].svgFn()
    .replace('width="140" height="140"', 'width="64" height="64"');
}

// ----- 進化エフェクト -----
function showEvo(txt) {
  document.getElementById('evoMon').innerHTML = monSVG(G.stage, 120);
  document.getElementById('evoTxt').textContent = txt;
  document.getElementById('evoOverlay').classList.add('on');
  setTimeout(() => {
    document.getElementById('evoOverlay').classList.remove('on');
    render();
  }, 3200);
}

// ----- メッセージ -----
let msgTimer = null;
function showMsg(t) {
  document.getElementById('sMsg').textContent = t;
  if (msgTimer) clearTimeout(msgTimer);
  msgTimer = setTimeout(() => {
    msgTimer = null;
    document.getElementById('sMsg').textContent = defaultMsg();
  }, 3000);
}

function defaultMsg() {
  if (G.stage === ST.EGG) {
    if (G.hatchPct < 30) return 'なにかが うごいている…';
    if (G.hatchPct < 70) return 'ヒビが はいってきた！';
    return 'もうすぐ うまれるよ！';
  }
  if (G.isSick)      return 'きもちわるい…  くすり…';
  if (G.isSleeping)  return 'すやすや…';
  if (G.alertActive) {
    if (G.alertType === 'hungry')  return 'おなかすいた…！';
    if (G.alertType === 'unhappy') return 'あそんで…！';
    if (G.alertType === 'sick')    return 'ぐあいわるい…！';
    if (G.alertType === 'poop')    return 'よごれたよ…';
  }
  if (G.hunger === 0) return 'おなかがすいた…';
  if (G.happy  === 0) return 'あそびたい…';
  return NAMES[G.stage] + ' は げんきだ！';
}

// ----- レンダリング -----
function render() {
  // モンスター
  const monEl = document.getElementById('sMon');
  monEl.innerHTML = monSVG(G.stage, 100);
  const svg = monEl.querySelector('svg');
  if (svg) {
    if (G.isSleeping) svg.classList.add('mon-sleep');
    else if (G.isSick) svg.classList.add('mon-sick');
    else svg.classList.add('mon-bounce');
  }

  // メッセージ
  if (!msgTimer) document.getElementById('sMsg').textContent = defaultMsg();

  // アラート表示
  const alertEl = document.getElementById('sAlert');
  alertEl.style.visibility = G.alertActive ? 'visible' : 'hidden';

  // アイコン
  const ic = [];
  if (G.isSick)     ic.push('🤒');
  if (G.isSleeping) ic.push('💤');
  document.getElementById('sIcons').textContent = ic.join(' ');

  // うんち
  document.getElementById('sPoops').innerHTML =
    Array(G.poopCount).fill('💩').join('');

  // ハート
  hearts('hHunger', G.hunger, 4);
  hearts('hHappy',  G.happy,  4);

  // 数値
  document.getElementById('vWeight').textContent  = G.weight;
  document.getElementById('vAge').textContent     = G.age;
  document.getElementById('vMistake').textContent = G.careMistakes;
  document.getElementById('vWins').textContent    = G.trainingWins;

  // アラートボタン強調
  const alertMap = { hungry:'bFood', unhappy:'bPlay', sick:'bMed', poop:'bClean' };
  ['bFood','bLight','bPlay','bMed','bClean','bStatus','bDisc'].forEach(id => {
    document.getElementById(id)?.classList.remove('flash');
  });
  if (G.alertActive && alertMap[G.alertType]) {
    document.getElementById(alertMap[G.alertType])?.classList.add('flash');
  }
}

function hearts(id, val, max) {
  document.getElementById(id).innerHTML =
    Array(max).fill(0).map((_,i) =>
      `<span class="heart">${i < val ? '❤️' : '🖤'}</span>`
    ).join('');
}

// ----- モンスターSVG -----
function monSVG(stage, size) {
  const fn = {
    [ST.EGG]:   svgEgg,
    [ST.BOTA]:  svgBotamon,
    [ST.KORO]:  svgKoromon,
    [ST.AGUM]:  svgAgumon,
    [ST.GREY]:  svgGreymon,
    [ST.SKULL]: svgSkullGreymon,
    [ST.METAL]: svgMetalGreymon
  }[stage];
  if (!fn) return '';
  return fn().replace('width="140" height="140"', `width="${size}" height="${size}"`);
}

function dotGrid(grid, pal) {
  const rows = grid.length, cols = grid[0].length;
  const cw = (140 / cols).toFixed(3), ch = (140 / rows).toFixed(3);
  let cells = '';
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const c = grid[y][x];
      if (!c || c === 0) continue;
      const color = pal[c] || '#000';
      cells += `<rect x="${(x*140/cols).toFixed(2)}" y="${(y*140/rows).toFixed(2)}" width="${cw}" height="${ch}" fill="${color}"/>`;
    }
  }
  return `<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">${cells}</svg>`;
}

  document.getElementById('confirmTxt').textContent = txt;
  document.getElementById('confirmModal').classList.add('on');
  const ok  = () => { close(); onOk(); };
  const no  = () => { close(); };
  const close = () => {
    document.getElementById('confirmModal').classList.remove('on');
    document.getElementById('confirmYes').removeEventListener('click', ok);
    document.getElementById('confirmNo').removeEventListener('click', no);
  };
  document.getElementById('confirmYes').addEventListener('click', ok);
  document.getElementById('confirmNo').addEventListener('click', no);
}

// ----- 初期化 -----
load();
render();

// スピードボタン初期化
document.querySelectorAll('[data-sp]').forEach(b =>
  b.classList.toggle('sel', b.dataset.sp === G.speed)
);

setInterval(tick, 1000);
</script>
</body>
